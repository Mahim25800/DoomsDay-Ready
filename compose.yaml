services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - doomsday-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(response => { if (!response.ok) process.exitCode = 1; }).catch(() => { process.exitCode = 1; })"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  doomsday-data:
